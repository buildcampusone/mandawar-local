<!DOCTYPE html>
<html lang="hi">
<head>
  <script src="./shared/services/safe-area.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#006B35">
  <title>Offline · Mandawar</title>
  <link rel="icon" href="./favicon.ico" sizes="any">
  <style>
    :root { color-scheme: light dark; --bg:#F7FAF7; --text:#14251C; --muted:#5E7266; --primary:#006B35; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0A1510; --text:#E8F3EC; --muted:#93A89B; --primary:#00A45B; } }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:calc(24px + var(--safe-top,0px)) 24px 24px; box-sizing:border-box;
           background:var(--bg); color:var(--text); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align:center; }
    img { width:84px; height:84px; border-radius:20px; }
    h1 { font-size:1.3rem; margin:16px 0 6px; } p { margin:0 0 18px; color:var(--muted); max-width:30ch; }
    button { font:inherit; font-weight:600; border:0; border-radius:999px; padding:12px 26px; background:var(--primary); color:#fff; cursor:pointer; }
  </style>
</head>
<body>
  <main>
    <img src="./assets/brand/mark.png" alt="Mandawar">
    <h1>Internet nahi hai</h1>
    <p>Connection wapas aate hi Mandawar dobara khul jayega. Pehle dekhe hue page offline bhi chalte hain.</p>
    <button type="button" id="retry">Dobara try karein</button>
  </main>
  <script>
    document.getElementById("retry").onclick = function () { location.reload(); };
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
