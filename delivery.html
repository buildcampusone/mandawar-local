<!DOCTYPE html>
<html lang="hi">
<head>
  <script src="./shared/services/safe-area.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#006B35">
  <title>Rider · Mandawar</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="./shared/styles/tokens.css">
  <link rel="stylesheet" href="./shared/styles/global.css">
  <link rel="stylesheet" href="./shared/styles/shell.css">
  <link rel="stylesheet" href="./shared/styles/orders.css">
</head>
<body>
  <script src="./shared/components/splash.js"></script>
  <script type="module" src="./shared/services/pwa.js"></script>
  <header class="topbar">
    <a class="brand" href="./"><img src="./assets/brand/mark.png" alt="Mandawar logo"><span class="brand-txt"><span class="brand-name">Mandawar</span><small>Your Local Marketplace</small></span></a>
  </header>
  <main class="container">
    <section class="hero" data-panel="jobs">
      <h1 id="welcome">Loading...</h1>
      <p>Naye delivery orders lein aur deliver karein. Cash customer se aap collect karte hain.</p>
    </section>

    <section id="jobs-section" data-panel="jobs" hidden>
      <h2>Delivery orders</h2>
      <div id="job-list"></div>
    </section>
  </main>
  <script type="module">
    import { requireRole, logOut } from "./shared/services/auth.js";
    import { mountShell } from "./shared/components/shell.js";
    import { initJobs } from "./modules/delivery/jobs.js";
    const $ = (id) => document.getElementById(id);

    requireRole("delivery", (user, profile) => {
      $("welcome").textContent = "Namaste, " + profile.name;
      initJobs(user, profile);
      mountShell({
        role: "delivery", user, profile, initial: "jobs",
        items: [{ id: "jobs", icon: "rider", key: "navRiderJobs", shortKey: "shRiderJobs" }],
        onLogout: async () => { await logOut(); location.href = "./login.html"; }
      });
    });
  </script>
</body>
</html>
