<!DOCTYPE html>
<html lang="hi">
<head>
  <script src="./shared/services/safe-area.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#087A43">
  <title>Admin · Mandawar Mart</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="./shared/styles/tokens.css">
  <link rel="stylesheet" href="./shared/styles/global.css">
  <link rel="stylesheet" href="./shared/styles/shell.css">
</head>
<body>
  <script src="./shared/components/splash.js"></script>
  <script type="module" src="./shared/services/pwa.js"></script>
  <header class="topbar">
    <a class="brand" href="./"><img src="./assets/brand/mark.png" alt="Mandawar Mart logo"><span class="brand-txt"><span class="brand-name">Mandawar Mart</span><small>Your Daily Grocery Store</small></span></a>
  </header>
  <main class="container">
    <section class="hero" data-panel="orders products categories shop riders">
      <h1 id="welcome">Loading...</h1>
      <p>Mandawar Mart - owner dashboard.</p>
    </section>

    <p id="shop-status" data-panel="shop" hidden></p>

    <section id="shop-settings" data-panel="shop" hidden></section>

    <form id="shop-form" data-panel="shop" style="max-width:420px" hidden>
      <h2>Store set up karein</h2>
      <input id="shop-name" placeholder="Store ka naam" maxlength="60" required>
      <textarea id="shop-address" placeholder="Pura pata (Mandawar)" rows="3" maxlength="200" required></textarea>
      <input id="shop-phone" type="tel" placeholder="Mobile number" maxlength="14" required>
      <p id="shop-msg"></p>
      <button class="category" type="submit">Store banayein</button>
    </form>

    <section id="orders-section" data-panel="orders" hidden>
      <h2>Aaye hue orders</h2>
      <div id="order-list"></div>
    </section>

    <section id="categories-section" data-panel="categories" hidden>
      <h2>Departments</h2>
      <p class="muted">Grocery departments jaise Atta &amp; Flour, Dal &amp; Pulses. Customer inhi me se saaman chunta hai. Hataye nahi jaate, sirf inactive hote hain.</p>
      <div id="category-seed" style="margin-bottom:12px"></div>
      <form id="category-form" style="max-width:420px">
        <input id="category-name" placeholder="Naya department ka naam" maxlength="30" required>
        <p id="category-msg"></p>
        <button class="category" type="submit">Department jodein</button>
      </form>
      <div id="category-list"></div>
    </section>

    <section id="products-section" data-panel="products" hidden>
      <h2>Products</h2>
      <form id="product-form" style="max-width:420px">
        <input id="p-name" placeholder="Product ka naam" maxlength="80" required>
        <input id="p-price" type="number" step="0.01" min="0.01" placeholder="Price (Rs)" required>
        <input id="p-mrp" type="number" step="0.01" min="0.01" placeholder="MRP / asli keemat (optional, discount dikhane ke liye)">
        <select id="p-unit"></select>
        <input id="p-stock" type="number" step="1" min="0" placeholder="Stock" required>
        <select id="p-category" aria-label="Department"></select>
        <label class="fld"><span>Product ki photo (optional)</span><input id="p-photo" type="file" accept="image/*"></label>
        <p id="product-msg"></p>
        <button class="category" type="submit">Product jodein</button>
      </form>
      <div id="product-list"></div>
    </section>

    <section data-panel="riders">
      <div id="riders-root"></div>
    </section>
  </main>
  <script type="module">
    import { requireRole, logOut } from "./shared/services/auth.js";
    import { mountShell } from "./shared/components/shell.js";
    import { UNITS } from "./shared/config/units.js";
    import { ensureStore } from "./modules/admin/store.js";
    import { initCategories } from "./modules/admin/categories.js";
    import { initProducts } from "./modules/admin/products.js";
    import { initOrders } from "./modules/admin/orders.js";
    import { initStoreSettings } from "./modules/admin/store-settings.js";
    import { loadDeliveryPartners } from "./modules/admin/delivery-partners.js";
    const $ = (id) => document.getElementById(id);
    UNITS.forEach((u) => $("p-unit").add(new Option(u, u)));

    requireRole("admin", async (user, profile) => {
      $("welcome").textContent = "Namaste, " + profile.name;
      const shop = await ensureStore(user, profile);
      if (shop) { initCategories(); initProducts(); initOrders(user); initStoreSettings(user, shop); }

      mountShell({
        role: "admin", user, profile,
        initial: shop ? "orders" : "shop",
        locked: shop ? [] : ["orders", "products", "categories"], lockedTo: "shop",
        items: [
          { id: "orders",   icon: "orders",   key: "navShopOrders", shortKey: "shOrders" },
          { id: "products", icon: "products", key: "navProducts",   shortKey: "shProducts" },
          { id: "categories", icon: "grid", key: "navDepartments", shortKey: "shDepartments" },
          { id: "riders",   icon: "rider",    key: "navRiders",     shortKey: "shRiders" },
          { id: "shop",     icon: "shop",     key: "navMyShop",     shortKey: "shShop" }
        ],
        bottom: ["orders", "products", "categories", "riders", "profile"],
        profileRows: () => shop ? [["Store", shop.name], ["Pata", shop.address]] : [["Store", "Abhi set up nahi hua"]],
        onLogout: async () => { await logOut(); location.href = "./login.html"; },
        onEnter: (id) => { if (id === "riders") loadDeliveryPartners($("riders-root")); }
      });
    });
  </script>
</body>
</html>
