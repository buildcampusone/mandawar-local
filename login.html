<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#006B35">
  <title>Login · Mandawar</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mandawar">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-startup-image" href="./assets/brand/splash-1170x2532.jpg" media="(device-width:390px) and (device-height:844px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)">
  <link rel="apple-touch-startup-image" href="./assets/brand/splash-1179x2556.jpg" media="(device-width:393px) and (device-height:852px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)">
  <link rel="apple-touch-startup-image" href="./assets/brand/splash-1290x2796.jpg" media="(device-width:430px) and (device-height:932px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="./shared/styles/tokens.css">
  <link rel="stylesheet" href="./shared/styles/global.css">
  <link rel="stylesheet" href="./shared/styles/login.css">
</head>
<body class="login-page">
  <script src="./shared/components/splash.js"></script>
  <div class="app">
    <header class="hero">
      <div class="hero-top">
        <div class="hb">
          <span class="hb-name">Mandawar</span>
          <span class="hb-tag">Your Local Marketplace</span>
        </div>
        <button type="button" class="lang-pill" id="lang-btn" aria-label="Change language">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.7 3.9 5.7 3.9 9s-1.3 6.3-3.9 9c-2.6-2.7-3.9-5.7-3.9-9S9.4 5.7 12 3z"/></svg>
          <span id="lang-label" data-i18n="lang">हिन्दी</span>
        </button>
      </div>
      <div class="stage-wrap" aria-hidden="true"><div class="stage" id="stage"></div></div>
      <svg class="wave" viewBox="0 0 390 44" preserveAspectRatio="none" aria-hidden="true"><path d="M0 44V18C60 -2 125 -4 200 14S335 36 390 10V44Z"/></svg>
    </header>

    <main class="sheet">
      <h1 id="title" data-i18n="login">लॉगिन करें</h1>
      <p class="sub" id="sub" data-i18n="sub">अपने शहर की दुकानों से जुड़ें</p>

      <form id="auth-form" novalidate>
        <div id="signup-fields" hidden>
          <label class="field">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            <input id="name" data-i18n-ph="name" placeholder="पूरा नाम" autocomplete="name">
          </label>
          <label class="field">
            <svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></svg>
            <span class="cc">+91</span>
            <input id="phone" data-i18n-ph="phone" placeholder="मोबाइल नंबर" inputmode="numeric" maxlength="10" autocomplete="tel-national" class="has-cc">
          </label>
          <label class="field select">
            <svg viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9M4 9v11h16V9M9 20v-6h6v6"/></svg>
            <select id="role">
              <option value="customer" data-i18n="customer">मैं ग्राहक हूँ</option>
              <option value="shopkeeper" data-i18n="shopkeeper">मैं दुकानदार हूँ</option>
            </select>
          </label>
        </div>

        <label class="field">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3.5 7.5L12 13l8.5-5.5"/></svg>
          <input id="email" type="email" data-i18n-ph="email" placeholder="ईमेल" autocomplete="email" required>
        </label>
        <label class="field">
          <svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
          <input id="password" type="password" data-i18n-ph="password" placeholder="पासवर्ड" autocomplete="current-password" required minlength="6">
          <button type="button" class="eye" id="eye" aria-label="Show password">
            <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </label>

        <p id="msg" aria-live="polite"></p>
        <button class="cta" type="submit" id="submit" disabled data-i18n="cont">आगे बढ़ें</button>
      </form>

      <div class="or"><span data-i18n="or">या</span></div>
      <a href="#" id="toggle" class="alt" data-i18n="newAcc">नया अकाउंट बनाएं</a>

      <p class="terms">
        <span data-i18n="terms1">आगे बढ़कर, मैं</span>
        <a href="#" data-i18n="terms2">नियम और शर्तें</a>
        <span data-i18n="terms3">और</span>
        <a href="#" data-i18n="terms4">प्राइवेसी पॉलिसी</a>
        <span data-i18n="terms5">स्वीकार करता/करती हूँ</span>
      </p>
    </main>
  </div>
  <script type="module" src="./modules/auth/login-visual.js"></script>
  <script type="module" src="./modules/auth/login.js"></script>
</body>
</html>
